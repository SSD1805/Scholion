name: Mermaid docs bootstrap

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: mermaid-docs-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/deterministic-mermaid-svg'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Detect completed bootstrap
        id: state
        shell: bash
        run: |
          if test -f docs/diagrams/manifest.json; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Node runtime
        if: steps.state.outputs.needed == 'true'
        run: node --version && npm --version

      - name: Generate the docs-tooling lockfile
        if: steps.state.outputs.needed == 'true'
        working-directory: tools/mermaid
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Install locked Mermaid renderer
        if: steps.state.outputs.needed == 'true'
        working-directory: tools/mermaid
        run: npm ci --no-fund --no-audit

      - name: Enable Chromium user-namespace sandbox
        if: steps.state.outputs.needed == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Fix qualified Mermaid portability defects
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const replacements = [
            {
              file: "docs/architecture/diarization.md",
              before: "    B --> D[Dr. Chen (speaker-01)]",
              after: '    B --> D["Dr. Chen (speaker-01)"]',
            },
          ];

          for (const { file, before, after } of replacements) {
            const text = readFileSync(file, "utf8");
            const count = text.split(before).length - 1;
            if (count !== 1) {
              throw new Error(
                `${file}: expected exactly one qualified portability defect, found ${count}`,
              );
            }
            writeFileSync(file, text.replace(before, after), "utf8");
          }
          NODE

      - name: Migrate inline Mermaid and render deterministic SVGs
        if: steps.state.outputs.needed == 'true'
        run: node tools/mermaid/render.mjs --migrate-inline

      - name: Commit generated migration state
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate deterministic Mermaid documentation'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
