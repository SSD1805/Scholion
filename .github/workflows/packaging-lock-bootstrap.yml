name: Packaging lock bootstrap (temporary)

on:
  push:
    branches: [release/packaging-qualification]

permissions:
  contents: write

jobs:
  lock-packaging:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Add locked packaging dependency group
        shell: python
        run: |
          from pathlib import Path

          project = Path("pyproject.toml")
          text = project.read_text()
          if "[dependency-groups]\npackaging = [\n" not in text:
              needle = "[dependency-groups]\ndev = [\n"
              replacement = (
                  "[dependency-groups]\n"
                  "packaging = [\n"
                  '    "pyinstaller==6.22.2",\n'
                  "]\n"
                  "dev = [\n"
              )
              if text.count(needle) != 1:
                  raise SystemExit("dependency-groups boundary changed unexpectedly")
              project.write_text(text.replace(needle, replacement, 1))

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Regenerate lockfile
        run: uv lock

      - name: Install locked formatter and packaging graph
        run: uv sync --locked --group dev --group packaging

      - name: Apply safe Python lint fixes and canonical formatting
        shell: bash
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .

      - name: Pin Rust formatter
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          rustup default 1.90.0
          rustfmt --version

      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --all

      - name: Verify locked packaging group
        run: uv sync --locked --group packaging --no-dev

      - name: Commit normalized branch and remove bootstrap
        shell: bash
        run: |
          git rm .github/workflows/packaging-lock-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name "scholion-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Lock packaging toolchain and normalize release branch"
          git push
