name: Packaging Bootstrap (temporary)

on:
  push:
    branches: [release/packaging-qualification]

permissions:
  contents: write

jobs:
  patch-diarization-acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Replace one-speaker fixture with pinned two-speaker evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/acceptance.yml")
          text = path.read_text()
          needle = '      - "scripts/verify_cross_platform_media_acceptance.py"\n'
          replacement = (
              needle
              + '      - "scripts/fetch_diarization_fixture.py"\n'
              + '      - "scripts/verify_diarization_acceptance.py"\n'
          )
          if text.count(needle) != 2:
              raise SystemExit("acceptance path filters changed unexpectedly")
          text = text.replace(needle, replacement)

          old = '''      - name: Install local speech synthesizer
              run: |
                sudo apt-get update
                sudo apt-get install --yes espeak-ng

            - name: Generate non-sensitive local speech
              shell: bash
              run: >-
                espeak-ng
                -w "${{ runner.temp }}/diarization-acceptance.wav"
                "Scholion is running a local speaker diarization acceptance test. The recording stays on this runner."

            - name: Run real Community-1 inference twice
              run: >-
                uv run python scripts/verify_diarization_acceptance.py
                "${{ runner.temp }}/diarization-acceptance.wav"
                --cache-dir "${{ runner.temp }}/pyannote-cache"
          '''
          new = '''      - name: Fetch pinned two-speaker ground-truth fixture
              run: >-
                uv run python scripts/fetch_diarization_fixture.py
                --output-dir "${{ runner.temp }}/diarization-fixture"

            - name: Run real Community-1 inference twice against ground truth
              run: >-
                uv run python scripts/verify_diarization_acceptance.py
                "${{ runner.temp }}/diarization-fixture/dev00.wav"
                --reference-rttm "${{ runner.temp }}/diarization-fixture/debug.development.rttm"
                --cache-dir "${{ runner.temp }}/pyannote-cache"
          '''
          if old not in text:
              raise SystemExit("diarization acceptance block changed unexpectedly")
          path.write_text(text.replace(old, new, 1))

      - name: Commit fixture switch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "scholion-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/acceptance.yml
          git commit -m "Use pinned two-speaker diarization acceptance fixture"
          git push
