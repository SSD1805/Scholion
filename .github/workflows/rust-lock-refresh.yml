name: Rust Lockfile Refresh

on:
  pull_request:
    paths:
      - ".github/workflows/rust-lock-refresh.yml"
      - "frontend/src-tauri/Cargo.toml"
      - "frontend/src-tauri/Cargo.lock"
      - "frontend/src-tauri/src/**"

permissions:
  contents: write

concurrency:
  group: rust-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/production-trust-inputs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact same-repository head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/production-trust-inputs
          persist-credentials: true

      - name: Pin Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustc --version
          cargo --version

      - name: Resolve lockfile with Cargo
        shell: bash
        run: >-
          cargo metadata
          --manifest-path frontend/src-tauri/Cargo.toml
          --format-version 1
          > /dev/null

      - name: Upload Cargo-generated lockfile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scholion-rust-lock-${{ github.sha }}
          path: frontend/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Commit only Cargo-generated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- frontend/src-tauri/Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Rust lockfile for native verifier"
          git push origin HEAD:release/production-trust-inputs
