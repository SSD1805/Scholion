name: Theme Gallery Bootstrap

on:
  push:
    branches: [docs/theme-gallery]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out theme gallery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Capture registered themes
        working-directory: frontend
        run: npm run docs:theme-gallery

      - name: Commit generated gallery images
        shell: bash
        run: |
          git add docs/images/themes
          if git diff --cached --quiet; then
            echo "Theme gallery already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: render theme gallery"
          git push origin HEAD:docs/theme-gallery
