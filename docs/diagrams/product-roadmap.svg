    <g><rect x="1165" y="125" width="180" height="90" rx="18" fill="#FFF0B8" stroke="#8A6B18" stroke-width="3"/><text x="1255" y="162" text-anchor="middle" fill="#2C260F">Durable research</text><text x="1255" y="185" text-anchor="middle" fill="#2C260F">authority</text></g>
