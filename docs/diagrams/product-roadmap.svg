<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1800 500">
  <title id="title">Scholion MVP roadmap</title>
  <desc id="desc">A linear roadmap from local media through transcription, canonical evidence, private retrieval, verified navigation, durable research, native desktop workflows, lifecycle and playback, signed update and model trust mechanics, pre-packaging readiness, Windows and macOS packaging, representative release qualification, and MVP release.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2E617B"/></marker>
  </defs>
  <rect width="1800" height="500" rx="30" fill="#FBF9F4"/>
  <text x="70" y="62" fill="#12222A" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="700">Scholion MVP roadmap</text>
  <text x="70" y="91" fill="#2E617B" font-family="Inter,Segoe UI,sans-serif" font-size="15">Finish pre-packaging readiness, package Windows/macOS, qualify the real release, then ship the MVP.</text>

  <g stroke="#2E617B" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M220 170H265"/><path d="M445 170H490"/><path d="M670 170H715"/><path d="M895 170H940"/><path d="M1120 170H1165"/><path d="M1345 170H1390"/>
