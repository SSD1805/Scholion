  <title id="title">Scholion family portrait</title>
  <desc id="desc">A recording becomes a canonical transcript, feeds private search and verified evidence navigation, supports durable research, unified discovery, saved searches, custody planning, incremental refresh, desktop Library and Research views, and an Updates and release trust surface.</desc>
