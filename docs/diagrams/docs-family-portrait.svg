  <rect width="1700" height="560" rx="30" fill="#FBF9F4"/>
  <text x="70" y="62" fill="#12222A" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="700">The Scholion family portrait</text>
  <text x="70" y="91" fill="#2E617B" font-family="Inter,Segoe UI,sans-serif" font-size="15">Evidence stays authoritative. Research stays durable. Search, presentation, and release machinery remain supporting systems.</text>

