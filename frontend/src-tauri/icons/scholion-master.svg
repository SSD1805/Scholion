<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Scholion application icon</title>
  <desc id="desc">A warm evidence page with a marginal annotation brace, restrained recorded-time waveform, and an ivory S-shaped annotation stroke on a dark field.</desc>
  <defs>
